user  lngz lngz;
worker_processes  1;

error_log  /tmp/openresty-error.log  info;
pid        /tmp/openresty.pid;

events {
    worker_connections  1024;
}

env WSPROXY_ADDR;
env WSPROXY_CONN_DATA;

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    resolver 8.8.8.8;

    lua_package_path ";;/home/lngz/bbstest/pttbbs/dockerfile-wsproxy/?.lua;/home/lngz/bbstest/pttbbs/dockerfile-wsproxy/?/init.lua";

    server {
        listen 8080 default_server;

        root /home/lngz/bbstest/pttbbs/dockerfile-wsproxy/html;

        location /bbs {
            content_by_lua_file /home/lngz/bbstest/pttbbs/dockerfile-wsproxy/wsproxy.lua;
        }

        location / {
            charset utf-8;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            charset utf-8;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            autoindex off;
        }
    }
}
